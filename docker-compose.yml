services:
  server:
    container_name: whatsapp-business-service
    build:
      context: ./
    ports:
      - 3001:3001
    environment:
     - COMMIT_HASH=running_via_docker_compose
     - HTTP_PORT=3001
     - WEBHOOK_SUBSCRIPTION_TOKEN=secret-token-passed-back-to-endpoint-by-meta-for-webhook-subscribing-created-on-customizing-use-case-webhook-configuration
     - WHATSAPP_SENDER_PHONE_NUMBER_ID=123456789012345-look-it-up-on-whatsapp-manager-phone-numbers
     - WHATSAPP_BUSINESS_API_TOKEN=123456789012345-generate-on-meta-business-suite-via-system-user
     - META_APP_SECRET=abcd1234-app-secret-on-app-settings-to-validate-requests-originate-from-meta
    healthcheck:
      test: ["CMD", "curl", "-f", "http://server:3001/is_alive"]
      interval: 15s
      retries: 3
      start_period: 5s
      timeout: 3s